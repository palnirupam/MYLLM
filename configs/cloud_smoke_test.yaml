model:
  vocab_size: 32000
  d_model: 128
  n_layers: 2
  n_heads: 4
  n_kv_heads: 2
  intermediate_size: 512
  max_seq_len: 128
  dropout: 0.0
  norm_eps: 1.0e-5
  rope_theta: 10000.0
  tie_word_embeddings: true

training:
  batch_size: 2
  gradient_accumulation_steps: 1
  learning_rate: 3.0e-4
  weight_decay: 0.1
  warmup_steps: 2
  max_steps: 20
  max_grad_norm: 1.0
  mixed_precision: bf16
  log_interval: 1
  checkpoint_interval: 5
  seed: 42

data:
  dataset_name: Salesforce/wikitext
  dataset_config: wikitext-2-raw-v1
  max_seq_len: 128

tokenizer:
  type: bpe
  vocab_size: 32000

output:
  dir: ./output/cloud_smoke_test
