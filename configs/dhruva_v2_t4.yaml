model:
  vocab_size: 48000
  d_model: 768
  n_layers: 12
  n_heads: 12
  n_kv_heads: 4
  intermediate_size: 2048
  max_seq_len: 1024
  dropout: 0.0
  norm_eps: 1.0e-5
  rope_theta: 10000.0
  tie_word_embeddings: true
  qk_norm: true

training:
  target_tokens: 1000000000
  world_size: 2
  micro_batch_per_gpu: 1
  gradient_accumulation_steps: 16
  learning_rate: 3.0e-4
  weight_decay: 0.1
  warmup_steps: 1000
  max_grad_norm: 1.0
  mixed_precision: fp16
  gradient_checkpointing: true
  log_interval: 10
  checkpoint_interval: 250
  validation_interval: 250
  validation_max_batches: 64
  smoke_context: 512
  seed: 20260818

data:
  max_seq_len: 1024

tokenizer:
  type: bpe
  vocab_size: 48000
  byte_fallback: true

output:
  dir: ./output/dhruva_v2_t4
  base_reference: releases/dhruva-v1-100m/inference_model
  max_retained_checkpoints: 3

validation:
  design_status: candidate
  expected_parameters: 112382208
