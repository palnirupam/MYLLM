model:
  vocab_size: 64000
  d_model: 768
  n_layers: 8
  n_heads: 12
  n_kv_heads: 4
  intermediate_size: 2048
  max_seq_len: 512
  dropout: 0.0
  norm_eps: 1.0e-5
  rope_theta: 10000.0
  tie_word_embeddings: true

training:
  # Stage 1A: 100M Target Token Budget
  target_tokens: 100000000
  world_size: 2                     # 2x Tesla T4 GPUs on Kaggle
  micro_batch_per_gpu: 2            # Explicitly per-GPU batch size
  gradient_accumulation_steps: 16   # Global batch size = 2 * 2 * 16 = 64 sequences (32,768 tokens/step)
  learning_rate: 3.0e-4
  weight_decay: 0.1
  warmup_steps: 200                 # ~6.5% of total 3,052 steps
  max_grad_norm: 1.0
  mixed_precision: fp16             # Native FP16 AMP for Tesla T4
  log_interval: 10
  checkpoint_interval: 250          # Checkpoint every 250 steps (~8.2M tokens)
  seed: 42

data:
  max_seq_len: 512

tokenizer:
  type: bpe
  vocab_size: 64000

output:
  dir: ./output/dhruva_v1_production
  backup_dir: /kaggle/working/MYLLM_BACKUP
