model:
  vocab_size: 32000
  d_model: 768
  n_layers: 12
  n_heads: 12
  n_kv_heads: 4
  intermediate_size: 2048
  max_seq_len: 512
  dropout: 0.0
  norm_eps: 1.0e-5
  rope_theta: 10000.0
  tie_word_embeddings: true

training:
  batch_size: 2
  gradient_accumulation_steps: 16
  learning_rate: 3.0e-4
  weight_decay: 0.1
  warmup_steps: 100
  max_steps: 500
  max_grad_norm: 1.0
  mixed_precision: bf16
  log_interval: 10
  checkpoint_interval: 250
  seed: 42

data:
  dataset_name: Salesforce/wikitext
  dataset_config: wikitext-2-raw-v1
  max_seq_len: 512

tokenizer:
  type: bpe
  vocab_size: 32000

output:
  dir: ./output/v0_100m
