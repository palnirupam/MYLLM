[project]
name = "myllm"
version = "0.1.0"
description = "MyLLM — A future-proof AI platform"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "safetensors>=0.4",
    "tokenizers>=0.19",
    "datasets>=2.0",
    "pyyaml>=6.0",
    "numpy",
]

[project.scripts]
myllm = "myllm.cli.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["myllm*"]
